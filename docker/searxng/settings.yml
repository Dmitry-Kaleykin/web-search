use_default_settings: true

general:
  instance_name: Local Agentic Web Search

server:
  # This service is bound to 127.0.0.1 by compose. Replace the key before exposing it elsewhere.
  secret_key: local-only-change-before-exposing
  # `limiter` is INBOUND bot protection for a public instance. It does not reduce the rate at
  # which this instance calls upstream engines, so it does not fix upstream 429/CAPTCHA.
  # Keep it off while bound to loopback; enable it (plus valkey) only if the port is exposed.
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  # 4.0s was tight enough to kill engines that were healthy but slow (Codeberg answers in ~4.6s).
  request_timeout: 5.0
  max_request_timeout: 12.0
  # SearXNG retries upstream itself, and the Python client retries on top of that. Nested
  # retries multiply request volume against an engine that has already said "too many requests",
  # which deepens the block instead of clearing it. Retry policy lives in the client layer.
  retries: 0
  pool_connections: 100
  pool_maxsize: 10
  keepalive_expiry: 5.0
  # HTTP/2 fingerprints closer to a real modern browser than HTTP/1.1 does.
  enable_http2: true
  useragent_suffix: "local single-user research instance"

# Engine policy. Every verdict below is a per-engine measurement made against this instance with
# `?engines=<name>` pinning, so the numbers are isolated to that engine and not the aggregate.
# Re-measure before changing anything: engines come and go, and a name that worked last month may
# now be a CAPTCHA wall.
engines:
  # ---------------------------------------------------------------- hard walls: never answer ---
  # Note the endpoint nuance: DuckDuckGo's legacy HTML endpoint is a CAPTCHA magnet while its
  # `/web` and news endpoints answer normally, so only the legacy one is disabled here.
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: startpage news
    disabled: true
  - name: google news
    disabled: true
  - name: qwant
    disabled: true
  - name: infospace
    disabled: true
  - name: fastbot
    disabled: true
  - name: yahoo
    disabled: true
  - name: fireball news
    disabled: true
  - name: tusksearch news
    disabled: true
  # Repeated transport failures, not rate limits: 2/2 HTTP errors and an origin that no longer
  # serves the documented endpoint. These cost latency and return nothing.
  - name: metacpan
    disabled: true
  - name: tagesschau
    disabled: true
  - name: nixos wiki
    disabled: true
  - name: encyclosearch
    disabled: true

  # ------------------------------------------------ general web: independent indexes -----------
  # Measured: n results / latency. Restores diversity after three of four mainstream indexes blocked.
  - name: mojeek
    disabled: false
    categories: [general, web]
    timeout: 5.0
  - name: mwmbl
    disabled: false
    categories: [general, web]
    timeout: 5.0
  - name: searchmysite
    disabled: false
    categories: [general, web]
    timeout: 5.0
  - name: crowdview
    disabled: false
    categories: [general, web]
    timeout: 6.0
  - name: duckduckgo web
    disabled: false
    categories: [general, web]
    timeout: 6.0
  # Disabled on purpose. Its endpoint is a different surface, but the index underneath it is the
  # same one `google cse` already reaches, so it adds a CAPTCHA magnet (observed on 1 of 2 probes)
  # for almost no new coverage. Prefer the cse entry.
  - name: google
    disabled: true
  # Curated indie web. Small and quirky, but surfaces material no mainstream index carries.
  - name: wiby
    disabled: false
    categories: [general, web]
    weight: 0.4
    timeout: 5.0

  # -------------------------------------------------- soft: answered, sometimes off-topic -----
  - name: bing
    disabled: false
    categories: [general, web]
    weight: 0.5
    timeout: 5.0
  # Rate-suspended rather than hard-blocked, so it stays enabled and is cooled down client-side.
  - name: brave
    weight: 0.7
    timeout: 6.0

  # ------------------------------------------------------- news: 6 healthy engines ------------
  - name: mojeek news
    disabled: false
    categories: [news]

  # ------------------------------------------------------ it: documentation and packages -----
  # Official, key-free APIs that answer precisely for engineering questions. Only used by `it`
  # category queries and bangs, so they cannot pollute general web results.
  - name: hackernews
    disabled: false
    categories: [it]
    timeout: 5.0
  - name: lobste.rs
    disabled: false
    categories: [it]
    timeout: 5.0
  - name: microsoft learn
    disabled: false
    categories: [it]
    timeout: 5.0
  - name: npm
    disabled: false
    categories: [it]
    timeout: 5.0
  - name: crates.io
    disabled: false
    categories: [it]
    timeout: 5.0
  - name: pkg.go.dev
    disabled: false
    categories: [it]
    timeout: 5.0
  - name: huggingface
    disabled: false
    categories: [it]
    timeout: 5.0
  - name: discuss.python
    disabled: false
    categories: [it]
    timeout: 6.0
  - name: alpine linux packages
    disabled: false
    categories: [it]
    timeout: 5.0
  # CVE lookups against the authoritative source. Low volume by design: it answers exactly the
  # identifier queries it is for.
  - name: national vulnerability database
    disabled: false
    categories: [it]
    timeout: 6.0
  # Healthy origin, just slow (~4.6s), so it needs a timeout above the global default.
  - name: codeberg
    disabled: false
    categories: [it]
    timeout: 9.0

  # ------------------------------------------- science: key-free scholarly infrastructure ----
  # The two biggest wins for the academic lane: 19 and 10 on-topic results, no API key required.
  - name: crossref
    disabled: false
    categories: [science]
    timeout: 8.0
  - name: openalex
    disabled: false
    categories: [science]
    timeout: 8.0
